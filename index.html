<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pocket Notes</title>
<style>
  :root{
    --bg:#F7F2EA;
    --surface:#FFFDF8;
    --surface-2:#FBF6EE;
    --text:#4A443C;
    --text-2:#9C948A;
    --text-3:#BDB4A8;
    --line:#ECE4D8;
    --accent:#A8B5A0;     /* 莫兰迪 鼠尾草绿 */
    --accent-soft:#E7ECE2;
    --shadow:0 2px 14px rgba(74,68,60,.06);
    --shadow-soft:0 1px 6px rgba(74,68,60,.05);
    --radius:20px;
    --radius-s:14px;
    --ease:cubic-bezier(.22,.61,.36,1);
    --dur:.2s;
  }
  [data-theme="dark"]{
    --bg:#1B1916;
    --surface:#25221E;
    --surface-2:#2C2823;
    --text:#DBD4C8;
    --text-2:#8E877B;
    --text-3:#6B655B;
    --line:#332F29;
    --accent:#9BAC93;
    --accent-soft:#2E3328;
    --shadow:0 2px 16px rgba(0,0,0,.28);
    --shadow-soft:0 1px 8px rgba(0,0,0,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Helvetica,"Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);
    font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
  }
  /* 手机外框（桌面预览用） */
  #app{
    position:relative;max-width:430px;margin:0 auto;min-height:100vh;
    background:var(--bg);
    box-shadow:0 0 60px rgba(0,0,0,.06);
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  @media(min-width:480px){
    body{padding:24px 0;background:var(--surface-2);}
    #app{min-height:calc(100vh - 48px);border-radius:34px;overflow:hidden;}
  }

  .page{position:absolute;inset:0;display:flex;flex-direction:column;
    opacity:0;pointer-events:none;transform:translateY(8px);
    transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);}
  .page.active{opacity:1;pointer-events:auto;transform:none;}

  /* ---------- 首页 ---------- */
  #home{padding:0 20px;overflow-y:auto;}
  .home-top{padding:54px 4px 6px;display:flex;justify-content:space-between;align-items:flex-start;}
  .greet-emoji{font-size:26px;line-height:1;margin-bottom:8px;}
  .greet{font-size:25px;font-weight:650;letter-spacing:.3px;color:var(--text);}
  .gdate{margin-top:4px;font-size:14px;color:var(--text-2);}
  .gdate b{color:var(--text);font-weight:600;}
  .icon-btn{width:42px;height:42px;border:none;border-radius:50%;
    background:var(--surface);box-shadow:var(--shadow-soft);color:var(--text-2);
    font-size:20px;display:flex;align-items:center;justify-content:center;
    transition:transform var(--dur) var(--ease),background var(--dur) var(--ease);}
  .icon-btn:active{transform:scale(.92);}

  .search{margin:18px 0 4px;position:relative;}
  .search input{width:100%;border:none;outline:none;background:var(--surface);
    box-shadow:var(--shadow-soft);border-radius:var(--radius-s);
    padding:14px 16px 14px 44px;font-size:15px;color:var(--text);
    transition:box-shadow var(--dur) var(--ease);}
  .search input::placeholder{color:var(--text-3);}
  .search input:focus{box-shadow:0 0 0 2px var(--accent-soft),var(--shadow-soft);}
  .search .mag{position:absolute;left:16px;top:50%;transform:translateY(-50%);
    color:var(--text-3);font-size:16px;}

  /* ---------- 侧边栏 ---------- */
  .sidebar{position:absolute;left:0;top:0;bottom:0;width:260px;max-width:80vw;background:var(--surface);z-index:200;
    transform:translateX(-110%);transition:transform var(--dur) var(--ease);box-shadow:4px 0 24px rgba(0,0,0,.08);
    display:flex;flex-direction:column;padding:50px 16px 24px;-webkit-overflow-scrolling:touch;}
  .sidebar.open{transform:none;}
  .sb-overlay{position:absolute;inset:0;background:rgba(0,0,0,.18);z-index:199;opacity:0;pointer-events:none;transition:opacity var(--dur);}
  .sb-overlay.open{opacity:1;pointer-events:auto;}
  .sb-head{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding:0 4px;}
  .sb-icon{width:42px;height:42px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--shadow-soft);}
  .sb-title{font-size:17px;font-weight:700;color:var(--text);}
  .sb-sub{font-size:12px;color:var(--text-3);margin-top:2px;}
  .sb-section-title{font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin:18px 4px 8px;}
  .sb-groups{display:flex;flex-direction:column;gap:3px;flex-shrink:0;max-height:45%;overflow-y:auto;}
  .sb-groups::-webkit-scrollbar{display:none;}
  .sb-group{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:all var(--dur) var(--ease);color:var(--text-2);}
  .sb-group:active{background:var(--accent-soft);}
  .sb-group.active{background:var(--accent-soft);color:var(--text);}
  .sb-group .sb-g-icon{font-size:18px;width:24px;text-align:center;}
  .sb-group .sb-g-name{flex:1;font-size:15px;}
  .sb-group .sb-g-count{margin-left:auto;font-size:12.5px;color:var(--text-3);min-width:24px;text-align:right;}
  .sb-group.active .sb-g-count{color:var(--text-2);}
  .sb-new-group{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;color:var(--text-3);padding:10px 12px;border-radius:12px;font-size:14.5px;text-align:left;transition:background var(--dur);font-family:inherit;}
  .sb-new-group:active{background:var(--accent-soft);color:var(--text);}
  .sb-div{height:1px;background:var(--line);margin:16px 4px;}
  .sb-tags{display:flex;flex-wrap:wrap;gap:8px;padding:0 2px;overflow-y:auto;flex:1;min-height:0;align-content:flex-start;}
  .sb-tags::-webkit-scrollbar{display:none;}
  .sb-tag{border:none;background:var(--bg);color:var(--text-2);padding:7px 12px;border-radius:999px;font-size:13px;transition:all var(--dur);font-family:inherit;}
  .sb-tag:active{background:var(--accent-soft);color:var(--text);}
  .sb-tag.on{background:var(--accent);color:#fff;}

  .list-title{font-size:13px;color:var(--text-3);margin:14px 4px 6px;font-weight:600;letter-spacing:.4px;}
  .cards{display:flex;flex-direction:column;gap:12px;padding-bottom:110px;}
  .card{background:var(--surface);border-radius:var(--radius);padding:16px 18px;
    box-shadow:var(--shadow);cursor:pointer;position:relative;
    transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
    animation:cardIn var(--dur) var(--ease) both;}
  .card:active{transform:scale(.985);box-shadow:0 1px 6px rgba(74,68,60,.05);}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
  .card-tag{position:absolute;top:16px;left:16px;font-size:12px;color:var(--accent);
    background:var(--accent-soft);padding:3px 10px;border-radius:999px;}
  .card-star{position:absolute;top:13px;right:13px;width:30px;height:30px;border:none;border-radius:50%;
    background:transparent;color:var(--text-3);font-size:16px;display:flex;align-items:center;justify-content:center;z-index:2;transition:all var(--dur) var(--ease);}
  .card-star:active{transform:scale(.85);}
  .card-star.on{color:#E8C25D;background:var(--surface-2);}
  .card-title{font-size:16.5px;font-weight:600;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:40px;}
  .card-body{margin-top:5px;font-size:14px;color:var(--text-2);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .card-time{margin-top:10px;font-size:12px;color:var(--text-3);}
  .empty{text-align:center;color:var(--text-3);padding:80px 20px;font-size:15px;line-height:1.8;}

  .fab{position:absolute;right:20px;bottom:30px;width:58px;height:58px;border:none;border-radius:50%;
    background:var(--accent);color:#fff;font-size:30px;font-weight:300;
    box-shadow:0 8px 22px rgba(168,181,160,.5);
    display:flex;align-items:center;justify-content:center;z-index:20;
    transition:transform var(--dur) var(--ease);}
  .fab:active{transform:scale(.9) rotate(90deg);}

  /* ---------- 编辑页 ---------- */
  #editor{padding:0;background:var(--bg);}
  .ed-top{display:flex;align-items:center;justify-content:space-between;
    padding:50px 16px 8px;}
  .ed-top .left{display:flex;align-items:center;gap:10px;}
  .back{width:40px;height:40px;border:none;border-radius:50%;background:var(--surface);
    box-shadow:var(--shadow-soft);font-size:22px;color:var(--text);display:flex;
    align-items:center;justify-content:center;transition:transform var(--dur) var(--ease);}
  .back:active{transform:scale(.9);}
  .saved{font-size:13px;color:var(--text-3);opacity:0;transition:opacity .4s var(--ease);}
  .saved.show{opacity:1;}
  .del{width:40px;height:40px;border:none;border-radius:50%;background:var(--surface);
    box-shadow:var(--shadow-soft);font-size:18px;color:#C99A9A;display:flex;
    align-items:center;justify-content:center;transition:transform var(--dur) var(--ease);}
  .del:active{transform:scale(.9);}

  .ed-scroll{flex:1;overflow-y:auto;padding:6px 22px 120px;}
  .ed-tags{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px;}
  .ed-tag{background:var(--accent-soft);color:var(--accent);padding:5px 10px 5px 12px;
    border-radius:999px;font-size:13px;display:flex;align-items:center;gap:6px;}
  .ed-tag b{font-weight:600;cursor:pointer;}
  .ed-tag-input{border:none;background:transparent;outline:none;color:var(--text);
    font-size:14px;min-width:90px;flex:1;}
  .ed-tag-input::placeholder{color:var(--text-3);}
  .title-input{width:100%;border:none;outline:none;background:transparent;
    font-size:24px;font-weight:680;color:var(--text);margin:8px 0 4px;
    font-family:inherit;}
  .title-input::placeholder{color:var(--text-3);font-weight:600;}
  .editor{border:none;outline:none;background:transparent;color:var(--text);
    font-size:16.5px;line-height:1.75;min-height:50vh;font-family:inherit;
    -webkit-user-select:text;user-select:text;}
  .editor:empty:before{content:attr(data-ph);color:var(--text-3);}
  .editor h2{font-size:20px;font-weight:680;margin:16px 0 6px;}
  .editor blockquote{margin:12px 0;padding:6px 0 6px 14px;border-left:3px solid var(--accent);
    color:var(--text-2);font-style:italic;}
  .editor ul{padding-left:22px;margin:8px 0;}
  .editor li{margin:3px 0;}
  .editor ul.todo{list-style:none;margin:8px 0;padding-left:0;}
  .editor ul.todo li{position:relative;padding-left:28px;margin:6px 0;min-height:24px;}
  .editor ul.todo li::before{content:"";position:absolute;left:0;top:4px;width:18px;height:18px;
    border-radius:6px;border:2px solid var(--text-3);background:transparent;transition:all var(--dur) var(--ease);}
  .editor ul.todo li.done::before{background:var(--accent);border-color:var(--accent);}
  .editor ul.todo li.done::after{content:"";position:absolute;left:5px;top:6px;width:5px;height:9px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
  .editor ul.todo li.done{color:var(--text-3);text-decoration:line-through;}
  .editor img{max-width:100%;border-radius:var(--radius-s);margin:10px 0;display:block;}
  .editor a{color:var(--accent);text-decoration:underline;}
  .editor hr{border:none;border-top:1px solid var(--line);margin:20px auto;width:100%;}
  #app[data-fs="small"] .editor{font-size:15px;}
  #app[data-fs="small"] .title-input{font-size:21px;}
  #app[data-fs="small"] .card-title{font-size:15px;}
  #app[data-fs="large"] .editor{font-size:18px;line-height:1.8;}
  #app[data-fs="large"] .title-input{font-size:27px;}
  #app[data-fs="large"] .card-title{font-size:17.5px;}

  .toolbar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:nowrap;gap:3px;
    padding:10px 8px calc(10px + env(safe-area-inset-bottom));
    background:var(--surface);box-shadow:0 -2px 16px rgba(74,68,60,.07);
    overflow:hidden;
    transform:translateY(110%);transition:transform var(--dur) var(--ease);}
  .toolbar.show{transform:none;}
  .tool{flex:1 1 0;min-width:34px;height:42px;border:none;border-radius:10px;
    background:transparent;color:var(--text);font-size:17px;display:flex;
    align-items:center;justify-content:center;transition:all var(--dur) var(--ease);}
  .tool:active,.tool.on{background:var(--accent-soft);color:var(--accent);transform:scale(.92);}
  .tool b{font-weight:800;font-size:16px;}
  .tool i{font-style:italic;font-size:17px;}

  /* ---------- 设置 ---------- */
  #settings{padding:0 20px;background:var(--bg);overflow-y:auto;}
  .set-top{padding:50px 0 8px;display:flex;align-items:center;gap:12px;font-size:22px;font-weight:650;}
  .set-top .back{position:static;}
  .set-card{background:var(--surface);border-radius:var(--radius);padding:6px 18px;
    box-shadow:var(--shadow);margin-top:6px;}
  .set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;
    border-bottom:1px solid var(--line);font-size:16px;}
  .set-row:last-child{border-bottom:none;}
  .set-row .left{display:flex;align-items:center;gap:12px;}
  .set-row .icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;font-size:18px;background:var(--accent-soft);}
  .set-row .right{color:var(--text-3);font-size:14px;display:flex;align-items:center;gap:6px;}
  .set-row .chevron{color:var(--text-3);font-size:13px;}
  .switch{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;
    transition:background var(--dur) var(--ease);cursor:pointer;flex:0 0 auto;}
  .switch.on{background:var(--accent);}
  .switch:after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;
    background:#fff;top:2px;left:2px;transition:transform var(--dur) var(--ease);box-shadow:0 1px 4px rgba(0,0,0,.2);}
  .switch.on:after{transform:translateX(20px);}
  .seg{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:10px;}
  .seg button{border:none;background:transparent;color:var(--text-2);font-size:13px;
    padding:5px 10px;border-radius:8px;transition:all var(--dur) var(--ease);}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .set-note{font-size:12.5px;color:var(--text-3);padding:16px 4px;line-height:1.7;}

  /* ---------- 弹窗 ---------- */
  .modal{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
    z-index:100;opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease);}
  .modal.show{opacity:1;pointer-events:auto;}
  .modal-back{flex:1;background:rgba(0,0,0,.25);}
  .modal-sheet{background:var(--surface);border-radius:24px 24px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 30px rgba(0,0,0,.12);transform:translateY(100%);transition:transform var(--dur) var(--ease);}
  .modal.show .modal-sheet{transform:none;}
  .modal-title{text-align:center;font-size:13px;color:var(--text-3);padding:10px 0 14px;}
  .modal-btn{display:block;width:100%;border:none;background:var(--surface-2);color:var(--text);
    padding:15px;border-radius:14px;font-size:16px;margin-bottom:10px;}
  .modal-btn.cancel{background:var(--surface);color:var(--text-2);margin-bottom:0;}
  .modal-body{padding:8px 8px 18px;color:var(--text-2);font-size:14.5px;line-height:1.7;text-align:center;}
  .modal-body strong{color:var(--text);font-size:18px;display:block;margin-bottom:6px;}
</style>
</head>
<body>
<div id="app">

  <!-- 侧边栏 -->
  <aside id="sidebar" class="sidebar">
    <div class="sb-head">
      <div class="sb-icon">📝</div>
      <div>
        <div class="sb-title">Pocket Notes</div>
        <div class="sb-sub">本地便签</div>
      </div>
    </div>
    <div class="sb-section-title">分组</div>
    <div class="sb-groups" id="sbGroups"></div>
    <button class="sb-new-group" id="btnNewGroup">+ 新建分组</button>
    <div class="sb-div"></div>
    <div class="sb-section-title">标签</div>
    <div class="sb-tags" id="sbTags"></div>
  </aside>
  <div id="sbOverlay" class="sb-overlay"></div>

  <!-- 首页 -->
  <section id="home" class="page active">
    <div class="home-top">
      <button class="icon-btn" id="btnMenu" aria-label="菜单">☰</button>
      <button class="icon-btn" id="btnSettings" aria-label="设置">⚙</button>
    </div>
    <div style="padding:0 4px;">
      <div class="greet-emoji" id="greetEmoji">🌤</div>
      <div class="greet" id="greetText">下午好</div>
      <div class="gdate" id="greetDate">今天 · 8月20日 星期四</div>
    </div>

    <div class="search">
      <span class="mag">🔍</span>
      <input id="searchInput" type="text" placeholder="搜索便签...">
    </div>

    <div class="list-title" id="listTitle">全部便签</div>
    <div class="cards" id="cardList"></div>

    <button class="fab" id="btnAdd" aria-label="新建">＋</button>
  </section>

  <!-- 编辑页 -->
  <section id="editor" class="page">
    <div class="ed-top">
      <div class="left">
        <button class="back" id="btnBack" aria-label="返回">←</button>
        <span class="saved" id="savedHint">已保存</span>
      </div>
      <button class="del" id="btnDelete" aria-label="删除">🗑</button>
    </div>
    <div class="ed-scroll">
      <div class="ed-tags" id="edTags"></div>
      <input class="title-input" id="titleInput" placeholder="标题（可为空）" maxlength="120">
      <div class="editor" id="editorBody" contenteditable="true" data-ph="写点什么..."></div>
    </div>
    <div class="toolbar" id="toolbar">
      <button class="tool" data-cmd="bold"><b>B</b></button>
      <button class="tool" data-cmd="italic"><i>I</i></button>
      <button class="tool" data-cmd="heading">Aa</button>
      <button class="tool" data-cmd="todo">☑</button>
      <button class="tool" data-cmd="ul">•</button>
      <button class="tool" data-cmd="quote">❝</button>
      <button class="tool" data-cmd="hr">—</button>
      <button class="tool" data-cmd="image">📷</button>
      <button class="tool" data-cmd="link">🔗</button>
    </div>
    <input type="file" id="imgInput" accept="image/*" hidden>
  </section>

  <!-- 设置 -->
  <section id="settings" class="page">
    <div class="set-top">
      <button class="back" id="setBack" aria-label="返回">←</button>
      <span>设置</span>
    </div>
    <div class="set-card">
      <div class="set-row">
        <div class="left"><span class="icon">🌗</span><span>主题</span></div>
        <div class="switch" id="themeSwitch"></div>
      </div>
      <div class="set-row">
        <div class="left"><span class="icon">🔤</span><span>字体大小</span></div>
        <div class="seg" id="fontSeg">
          <button data-fs="small">小</button>
          <button data-fs="normal">标准</button>
          <button data-fs="large">大</button>
        </div>
      </div>
      <div class="set-row">
        <div class="left"><span class="icon">💾</span><span>自动备份</span></div>
        <div class="switch" id="backupSwitch"></div>
      </div>
      <div class="set-row" id="rowExport" style="cursor:pointer;">
        <div class="left"><span class="icon">📤</span><span>导出</span></div>
        <div class="right"><span>Markdown / JSON</span><span class="chevron">›</span></div>
      </div>
      <div class="set-row" id="rowImport" style="cursor:pointer;">
        <div class="left"><span class="icon">📥</span><span>导入 / 恢复</span></div>
        <div class="right"><span class="chevron">›</span></div>
      </div>
      <div class="set-row" id="rowAbout" style="cursor:pointer;">
        <div class="left"><span class="icon">ℹ️</span><span>关于</span></div>
        <div class="right"><span class="chevron">›</span></div>
      </div>
    </div>
    <div class="set-note">
      全部数据保存在本机，无需登录、联网或注册。
    </div>
  </section>

</div>

<!-- 通用弹窗 -->
<div class="modal" id="modal">
  <div class="modal-back" id="modalBack"></div>
  <div class="modal-sheet" id="modalSheet">
    <div class="modal-title" id="modalTitle">导出</div>
    <div id="modalBody"></div>
  </div>
</div>
<input type="file" id="importInput" accept=".json" hidden>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const KEY = "pocketnotes.v1";
  const GROUPS_KEY = "pocketnotes.groups.v1";
  const WEEK = ["日","一","二","三","四","五","六"];
  const DEFAULT_GROUPS=[
    {id:"all",name:"全部",icon:"🗂",type:"all"},
    {id:"starred",name:"收藏",icon:"⭐",type:"starred"},
    {id:"inbox",name:"Inbox",icon:"📥",type:"inbox"},
    {id:"work",name:"工作",icon:"💼",tag:"工作"},
    {id:"ai",name:"AI",icon:"🤖",tag:"AI"},
    {id:"study",name:"学习",icon:"📚",tag:"学习"},
    {id:"idea",name:"灵感",icon:"💡",tag:"灵感"},
    {id:"temp",name:"临时",icon:"⏱",tag:"临时"},
    {id:"prompt",name:"AI Prompt",icon:"🪄",tag:"AI Prompt"}
  ];

  /* ---------- 数据层：每个便签唯一 UUID，Insert 一次后只 Update ---------- */
  function uid(){
    if(crypto && crypto.randomUUID) return crypto.randomUUID();
    return "n_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  }
  let notes = load();
  function load(){
    try{const r=localStorage.getItem(KEY);if(r){const a=JSON.parse(r);if(Array.isArray(a)&&a.length)return a;}}catch(e){}
    return [seed()];
  }
  function seed(){
    return {
      id:uid(),
      title:"🌿 欢迎使用 Pocket Notes",
      content:'<p>打开就写，写完就走。</p><p>试试底部的 <b>工具栏</b>：加粗、待办、列表、引用……</p><p>所有样式都<b>直接渲染</b>，你看不到任何 Markdown 符号。</p>',
      plain:"打开就写，写完就走。试试底部的 工具栏：加粗、待办、列表、引用……所有样式都直接渲染，你看不到任何 Markdown 符号。",
      tags:["💡 灵感"],
      createdAt:Date.now(),updatedAt:Date.now()
    };
  }
  let groups=loadGroups();
  function loadGroups(){
    try{const r=localStorage.getItem(GROUPS_KEY);if(r){const a=JSON.parse(r);if(Array.isArray(a)&&a.length)return a;}}catch(e){}
    return DEFAULT_GROUPS.map(g=>({...g}));
  }
  function persist(){
    try{
      localStorage.setItem(KEY,JSON.stringify(notes));
      localStorage.setItem(GROUPS_KEY,JSON.stringify(groups));
    }catch(e){console.warn("save failed",e);}
  }

  /* ---------- 顶部问候 ---------- */
  function greeting(){
    const h=new Date().getHours();
    if(h<5)return["🌙","凌晨好"];
    if(h<11)return["🌤","上午好"];
    if(h<13)return["☀️","中午好"];
    if(h<18)return["🌤","下午好"];
    return["🌆","晚上好"];
  }
  function renderGreet(){
    const [e,t]=greeting();
    const d=new Date();
    $("#greetEmoji").textContent=e;
    $("#greetText").textContent=t;
    $("#greetDate").innerHTML="今天 · "+ (d.getMonth()+1)+"月"+d.getDate()+"日 星期"+WEEK[d.getDay()];
  }

  /* ---------- 列表渲染 ---------- */
  let curQuery="",curTag="",curGroupId="all";
  function allTags(){
    const set=new Set();
    notes.forEach(n=>(n.tags||[]).forEach(t=>set.add(t)));
    return [...set];
  }
  function currentGroup(){return groups.find(g=>g.id===curGroupId)||groups[0];}
  function countGroup(g){
    if(!g)return 0;
    if(g.type==="all")return notes.length;
    if(g.type==="starred")return notes.filter(n=>n.starred).length;
    if(g.type==="inbox")return notes.filter(n=>!(n.tags||[]).length).length;
    if(g.tag)return notes.filter(n=>(n.tags||[]).includes(g.tag)).length;
    return 0;
  }
  function matchesGroup(n,g){
    if(!g||g.type==="all")return true;
    if(g.type==="starred")return !!n.starred;
    if(g.type==="inbox")return !(n.tags||[]).length;
    if(g.tag)return (n.tags||[]).includes(g.tag);
    return true;
  }
  function renderGroups(){
    const box=$("#sbGroups");box.innerHTML="";
    const curG=currentGroup();
    groups.forEach(g=>{
      const el=document.createElement("div");
      el.className="sb-group"+(curG.id===g.id?" active":"");
      el.innerHTML='<span class="sb-g-icon">'+esc(g.icon||"📁")+'</span><span class="sb-g-name">'+esc(g.name)+'</span><span class="sb-g-count">'+countGroup(g)+"</span>";
      el.onclick=()=>{curGroupId=g.id;curTag="";closeSidebar();renderGroups();renderTags();renderList();};
      box.appendChild(el);
    });
  }
  function renderTags(){
    const box=$("#sbTags");box.innerHTML="";
    const tags=allTags();
    if(!tags.length){box.innerHTML='<span style="color:var(--text-3);font-size:13px;padding:4px 2px;">还没有标签</span>';return;}
    tags.forEach(t=>{
      const c=document.createElement("button");
      c.className="sb-tag"+(curTag===t?" on":"");c.textContent="#"+esc(t);
      c.onclick=()=>{curTag=(curTag===t?"":t);renderTags();renderList();};
      box.appendChild(c);
    });
  }
  function plainPreview(n){
    const base=(n.plain||"").replace(/\n/g," ").trim();
    const title=(n.title||"").trim();
    let p=base;
    if(title && p.startsWith(title)) p=p.slice(title.length).trim();
    return p||"（空白便签）";
  }
  function timeLabel(ts){
    const d=new Date(ts),now=new Date();
    const sameDay=d.toDateString()===now.toDateString();
    const hh=String(d.getHours()).padStart(2,"0"),mm=String(d.getMinutes()).padStart(2,"0");
    if(sameDay)return hh+":"+mm;
    const yest=new Date(now);yest.setDate(now.getDate()-1);
    if(d.toDateString()===yest.toDateString())return "昨天";
    return (d.getMonth()+1)+"月"+d.getDate()+"日";
  }
  function renderList(){
    const list=$("#cardList");list.innerHTML="";
    const q=curQuery.trim().toLowerCase();
    const g=currentGroup();
    let arr=notes.filter(n=>{
      if(!matchesGroup(n,g))return false;
      if(curTag && !(n.tags||[]).includes(curTag))return false;
      if(q){
        const hay=((n.title||"")+" "+(n.plain||"")+" "+(n.tags||[]).join(" ")).toLowerCase();
        if(!hay.includes(q))return false;
      }
      return true;
    }).sort((a,b)=>b.updatedAt-a.updatedAt);

    let titleText=q?"搜索结果":(curTag?("标签 · "+curTag):g.name);
    $("#listTitle").textContent=titleText;
    if(!arr.length){
      list.innerHTML='<div class="empty">还没有便签<br>点右下角的 ＋ 写第一张吧</div>';
      return;
    }
    arr.forEach((n,i)=>{
      const c=document.createElement("div");
      c.className="card";c.style.animationDelay=(i*0.035)+"s";
      const tag=(n.tags&&n.tags[0])?'<span class="card-tag">'+esc(n.tags[0])+'</span>':"";
      const starClass="card-star"+(n.starred?" on":"");
      c.innerHTML=tag+
        '<button class="'+starClass+'" aria-label="收藏">★</button>'+
        '<div class="card-title">'+esc(n.title||"无标题")+'</div>'+
        '<div class="card-body">'+esc(plainPreview(n))+'</div>'+
        '<div class="card-time">'+timeLabel(n.updatedAt)+'</div>';
      c.querySelector(".card-star").onclick=e=>{
        e.stopPropagation();
        n.starred=!n.starred;n.updatedAt=Date.now();
        persist();renderGroups();renderList();
      };
      c.onclick=()=>openEditor(n.id);
      list.appendChild(c);
    });
  }
  function esc(s){return (s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}

  /* ---------- 编辑页 ---------- */
  const titleEl=$("#titleInput"),editorEl=$("#editorBody"),savedHint=$("#savedHint");
  const toolbar=$("#toolbar"),imgInput=$("#imgInput");
  let currentId=null,saveTimer=null,currentTags=[];

  function openEditor(id){
    let n=notes.find(x=>x.id===id);
    if(!n){ // 不应发生：创建只在 btnAdd 里做一次
      n={id:uid(),title:"",content:"",plain:"",tags:[],createdAt:Date.now(),updatedAt:Date.now()};
      notes.push(n);
    }
    currentId=n.id;
    currentTags=n.tags?n.tags.slice():[];
    titleEl.value=n.title||"";
    editorEl.innerHTML=n.content||"";
    renderEdTags();
    showPage("editor");
    setTimeout(()=>toolbar.classList.add("show"),260);
  }

  function commitEdTagInput(){
    const inp=document.querySelector("#edTags .ed-tag-input");
    if(!inp)return;
    const v=inp.value.trim().replace(/,$/,"");
    if(v&&!currentTags.includes(v)){currentTags.push(v);renderEdTags();scheduleSave();}
    else if(!v){inp.value="";}
  }
  function renderEdTags(){
    const box=$("#edTags");box.innerHTML="";
    currentTags.forEach((t,i)=>{
      const el=document.createElement("span");
      el.className="ed-tag";
      el.innerHTML='<span>'+esc(t)+'</span><b data-i="'+i+'">✕</b>';
      el.querySelector("b").onclick=()=>{currentTags.splice(i,1);renderEdTags();scheduleSave();};
      box.appendChild(el);
    });
    const inp=document.createElement("input");
    inp.className="ed-tag-input";inp.placeholder=currentTags.length?"+ 加标签":"# 加个标签（可留空）";
    inp.onkeydown=e=>{
      if(e.key==="Enter"||e.key===","){
        e.preventDefault();
        commitEdTagInput();
      }
    };
    inp.onblur=()=>commitEdTagInput();
    box.appendChild(inp);
  }

  function scheduleSave(){
    savedHint.classList.remove("show");
    clearTimeout(saveTimer);
    saveTimer=setTimeout(saveNow,500);
  }
  function saveNow(){
    commitEdTagInput();
    if(!currentId)return;
    const n=notes.find(x=>x.id===currentId);
    if(!n)return;
    const title=titleEl.value.trim();
    const html=editorEl.innerHTML;
    const plain=editorEl.innerText.replace(/\n+/g," ").replace(/\s+/g," ").trim();
    n.title=title;n.content=html;n.plain=(title+" "+plain).trim();
    n.tags=currentTags.slice();n.updatedAt=Date.now();
    persist();
    savedHint.classList.add("show");
    setTimeout(()=>savedHint.classList.remove("show"),1200);
  }

  function goBack(){
    commitEdTagInput();
    toolbar.classList.remove("show");
    const title=titleEl.value.trim();
    const plain=editorEl.innerText.replace(/\n/g,"").trim();
    const hasImg=editorEl.querySelector("img");
    const n=notes.find(x=>x.id===currentId);
    if(n && !title && !plain && !hasImg){
      // 空便签：退出自动删除（修复重复创建 Bug 的一环）
      notes=notes.filter(x=>x.id!==currentId);
      persist();
    }else{
      saveNow();
    }
    currentId=null;
    showPage("home");
    renderGreet();renderGroups();renderTags();renderList();
  }

  function deleteCurrent(){
    if(!currentId)return;
    if(!confirm("删除这张便签？"))return;
    notes=notes.filter(x=>x.id!==currentId);
    persist();currentId=null;
    toolbar.classList.remove("show");
    showPage("home");renderGreet();renderGroups();renderTags();renderList();
  }

  /* ---------- 富文本工具栏（WYSIWYG，无 Markdown 源码） ---------- */
  function exec(cmd,val){
    editorEl.focus();
    document.execCommand(cmd,false,val||null);
    onInput();
  }
  function toggleHeading(){
    const cur=document.queryCommandValue("formatBlock").toLowerCase();
    exec("formatBlock",cur==="h2"?"<p>":"<h2>");
  }
  function currentUl(){
    const s=window.getSelection();let n=s&&s.anchorNode;
    while(n&&n!==editorEl){if(n.nodeType===1&&n.tagName==="UL")return n;n=n.parentElement;}
    return null;
  }
  function insertTodo(){
    editorEl.focus();
    // 插入原生无序列表，再给它加上 .todo 类，由 CSS 渲染成 checkbox
    document.execCommand("insertUnorderedList");
    const ul=currentUl();
    if(ul && !ul.classList.contains("todo")) ul.classList.add("todo");
    onInput();
  }
  function addImage(file){
    const fr=new FileReader();
    fr.onload=()=>{editorEl.focus();document.execCommand("insertImage",false,fr.result);onInput();};
    fr.readAsDataURL(file);
  }
  function addLink(){
    const url=prompt("输入链接地址：","https://");
    if(url){exec("createLink",url);}
  }
  function toggleQuote(){
    const cur=document.queryCommandValue("formatBlock").toLowerCase();
    exec("formatBlock",cur==="blockquote"?"<p>":"<blockquote>");
  }
  function placeCaret(el){
    const r=document.createRange();r.selectNodeContents(el);r.collapse(false);
    const s=window.getSelection();s.removeAllRanges();s.addRange(r);
  }
  function insertDivider(){
    editorEl.focus();
    document.execCommand("insertHTML",false,'<hr><p><br></p>');
    const hr=editorEl.querySelector("hr:last-of-type");
    if(hr && hr.nextElementSibling)placeCaret(hr.nextElementSibling);
    onInput();
  }

  function onInput(){
    updateToolbarState();
    scheduleSave();
  }

  // 事件绑定
  document.getElementById("toolbar").addEventListener("click",e=>{
    const b=e.target.closest(".tool");if(!b)return;
    const c=b.dataset.cmd;
    if(c==="bold")exec("bold");
    else if(c==="italic")exec("italic");
    else if(c==="heading")toggleHeading();
    else if(c==="todo")insertTodo();
    else if(c==="ul")exec("insertUnorderedList");
    else if(c==="quote")toggleQuote();
    else if(c==="hr")insertDivider();
    else if(c==="image")imgInput.click();
    else if(c==="link")addLink();
  });
  // 引用内空行按回车自动退出引用
  editorEl.addEventListener("keydown",e=>{
    if(e.key==="Enter" && !e.shiftKey){
      try{
        const cur=document.queryCommandValue("formatBlock").toLowerCase();
        if(cur==="blockquote"){
          const s=window.getSelection();let node=s&&s.anchorNode;
          const p=node&&(node.nodeType===3?node.parentElement:node);
          if(p && p.closest("blockquote") && (p.innerText||"").trim()===""){
            e.preventDefault();
            document.execCommand("formatBlock",false,"<p>");
          }
        }
      }catch(err){}
    }
  });
  imgInput.addEventListener("change",e=>{if(e.target.files[0])addImage(e.target.files[0]);imgInput.value="";});

  editorEl.addEventListener("input",onInput);
  editorEl.addEventListener("keyup",updateToolbarState);
  editorEl.addEventListener("mouseup",updateToolbarState);
  // 待办勾选：点击行首 32px 区域切换勾选
  editorEl.addEventListener("click",e=>{
    const li=e.target.closest("ul.todo li");if(!li)return;
    const rect=li.getBoundingClientRect();
    if(e.clientX-rect.left<32){li.classList.toggle("done");onInput();}
  });
  // 工具栏高亮：待办
  function updateToolbarState(){
    const map={bold:"bold",italic:"italic"};
    document.querySelectorAll(".tool").forEach(b=>{
      const c=b.dataset.cmd;
      let on=false;
      try{
        if(c==="bold")on=document.queryCommandState("bold");
        else if(c==="italic")on=document.queryCommandState("italic");
        else if(c==="heading")on=document.queryCommandValue("formatBlock").toLowerCase()==="h2";
        else if(c==="ul")on=document.queryCommandState("insertUnorderedList");
        else if(c==="quote")on=document.queryCommandValue("formatBlock").toLowerCase()==="blockquote";
        else if(c==="todo"){const ul=currentUl();on=!!(ul&&ul.classList.contains("todo"));}
      }catch(e){}
      b.classList.toggle("on",!!on);
    });
  }

  titleEl.addEventListener("input",scheduleSave);

  /* ---------- 路由 ---------- */
  function showPage(id){
    document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===id));
  }

  $("#btnAdd").onclick=()=>{
    // 新建：只 Insert 一次（分配唯一 UUID）
    const n={id:uid(),title:"",content:"",plain:"",tags:[],createdAt:Date.now(),updatedAt:Date.now()};
    notes.push(n);persist();
    openEditor(n.id);
    setTimeout(()=>titleEl.focus(),300);
  };
  $("#btnBack").onclick=goBack;
  $("#btnDelete").onclick=deleteCurrent;
  $("#btnSettings").onclick=()=>showPage("settings");
  $("#searchInput").oninput=e=>{curQuery=e.target.value;renderList();};

  // 侧边栏
  function openSidebar(){$("#sidebar").classList.add("open");$("#sbOverlay").classList.add("open");}
  function closeSidebar(){$("#sidebar").classList.remove("open");$("#sbOverlay").classList.remove("open");}
  $("#btnMenu").onclick=openSidebar;
  $("#sbOverlay").onclick=closeSidebar;
  $("#btnNewGroup").onclick=()=>{
    const name=prompt("新建分组名称：");if(!name)return;
    const icon=prompt("选一个图标（可选，默认 📁）：","📁")||"📁";
    groups.push({id:"g_"+uid(),name:name.trim(),icon:icon.trim(),tag:name.trim()});
    persist();renderGroups();
  };

  // 设置：主题
  const themeSwitch=$("#themeSwitch");
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme",t);
    themeSwitch.classList.toggle("on",t==="dark");
    try{localStorage.setItem("pocketnotes.theme",t);}catch(e){}
  }
  let savedTheme="light";
  try{savedTheme=localStorage.getItem("pocketnotes.theme")||"light";}catch(e){}
  applyTheme(savedTheme);
  themeSwitch.onclick=()=>applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");

  // 设置：字体大小
  const app=$("#app");
  function applyFontSize(fs){
    app.setAttribute("data-fs",fs);
    document.querySelectorAll("#fontSeg button").forEach(b=>b.classList.toggle("on",b.dataset.fs===fs));
    try{localStorage.setItem("pocketnotes.fs",fs);}catch(e){}
  }
  let savedFs="normal";
  try{savedFs=localStorage.getItem("pocketnotes.fs")||"normal";}catch(e){}
  applyFontSize(savedFs);
  document.querySelectorAll("#fontSeg button").forEach(b=>b.onclick=()=>applyFontSize(b.dataset.fs));

  // 设置：自动备份
  const backupSwitch=$("#backupSwitch");
  function applyBackup(on){
    backupSwitch.classList.toggle("on",on);
    try{localStorage.setItem("pocketnotes.backup",on?"1":"0");}catch(e){}
  }
  let savedBackup=false;
  try{savedBackup=localStorage.getItem("pocketnotes.backup")==="1";}catch(e){}
  applyBackup(savedBackup);
  backupSwitch.onclick=()=>applyBackup(!backupSwitch.classList.contains("on"));
  // 每次保存时若开启自动备份则写一份副本
  const origPersist=persist;
  persist=function(){origPersist();try{if(localStorage.getItem("pocketnotes.backup")==="1")localStorage.setItem("pocketnotes.backup.data",localStorage.getItem(KEY));}catch(e){}};

  // 设置：导出 / 导入 / 关于
  const modal=$("#modal"),modalTitle=$("#modalTitle"),modalBody=$("#modalBody"),modalBack=$("#modalBack");
  function openModal(title,bodyHtml){
    modalTitle.textContent=title;modalBody.innerHTML=bodyHtml;
    modal.classList.add("show");
  }
  function closeModal(){modal.classList.remove("show");}
  modalBack.onclick=closeModal;

  function download(name,content,type){
    const blob=new Blob([content],{type:type});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();
    URL.revokeObjectURL(a.href);
  }
  function notesToMd(){
    return notes.map(n=>{
      const d=new Date(n.updatedAt);
      const head="# "+(n.title||"无标题")+"\n\n";
      const body=(n.content||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
      const meta="> "+(d.getMonth()+1)+"月"+d.getDate()+"日 "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+"\n\n";
      return head+body+"\n\n"+meta+"---\n\n";
    }).join("");
  }
  $("#rowExport").onclick=()=>{
    openModal("导出",""+
      '<button class="modal-btn" id="expJson">导出 JSON（完整数据）</button>'+
      '<button class="modal-btn" id="expMd">导出 Markdown（纯文本）</button>'+
      '<button class="modal-btn cancel" id="expCancel">取消</button>');
    $("#expCancel").onclick=closeModal;
    $("#expJson").onclick=()=>{download("pocket-notes.json",JSON.stringify(notes,null,2),"application/json");closeModal();};
    $("#expMd").onclick=()=>{download("pocket-notes.md",notesToMd(),"text/markdown");closeModal();};
  };
  const importInput=$("#importInput");
  $("#rowImport").onclick=()=>importInput.click();
  importInput.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(r.result);
        if(!Array.isArray(data))throw new Error("格式错误");
        if(confirm("导入会覆盖当前所有便签，确定继续？")){
          notes=data;persist();renderGroups();renderTags();renderList();
          alert("导入成功，共 "+notes.length+" 张便签");
        }
      }catch(err){alert("导入失败："+err.message);}
      importInput.value="";
    };
    r.readAsText(f);
  };
  $("#rowAbout").onclick=()=>{
    openModal("","<div class='modal-body'><strong>Pocket Notes</strong>v0.1 · 极简便签<br>离线优先，打开就写，写完就走。</div><button class='modal-btn cancel' id='aboutClose'>关闭</button>");
    $("#aboutClose").onclick=closeModal;
  };

  // 设置页返回
  $("#setBack").onclick=()=>showPage("home");

  // 初始
  renderGreet();renderGroups();renderTags();renderList();
  window.addEventListener("beforeunload",()=>{if(currentId)saveNow();});
})();
</script>
</body>
</html>
